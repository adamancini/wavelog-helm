name: Lint and Test

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/lint-test.yml'

jobs:
  lint:
    name: Lint and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3 --verify=false

      - name: helm lint --strict
        run: |
          for f in charts/wavelog/ci/*.yaml; do
            echo "==> $f"
            helm lint --strict charts/wavelog -f "$f"
          done

      - name: helm unittest
        run: helm unittest charts/wavelog

  validate:
    name: Validate rendered manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate
        run: |
          for f in charts/wavelog/ci/*.yaml; do
            echo "==> $f"
            helm template test charts/wavelog -f "$f" \
              | kubeconform -strict -summary -ignore-missing-schemas
          done
