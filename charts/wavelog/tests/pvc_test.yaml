suite: pvc
templates:
  - pvc.yaml
tests:
  - it: requests 5Gi by default
    asserts:
      - isKind: {of: PersistentVolumeClaim}
      - equal: {path: "spec.resources.requests.storage", value: 5Gi}
      - equal: {path: metadata.name, value: RELEASE-NAME-wavelog-data}
  - it: renders nothing with an existing claim
    set: {persistence.existingClaim: foo}
    asserts:
      - hasDocuments: {count: 0}
  - it: renders nothing when persistence is disabled
    set: {persistence.enabled: false}
    asserts:
      - hasDocuments: {count: 0}
  - it: keeps the claim on uninstall by default
    asserts:
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
  - it: drops the keep annotation when persistence.keep is false
    set: {persistence.keep: false}
    asserts:
      - notExists: {path: metadata.annotations}
