suite: backup
templates:
  - backup-cronjob.yaml
  - backup-pvc.yaml
  - configmap-backup.yaml
set:
  backup.enabled: true
tests:
  - it: renders nothing when disabled
    set: {backup.enabled: false}
    asserts:
      - hasDocuments: {count: 0}
  - it: schedules a non-overlapping CronJob with the MariaDB image
    template: backup-cronjob.yaml
    asserts:
      - isKind: {of: CronJob}
      - equal: {path: metadata.name, value: RELEASE-NAME-wavelog-backup}
      - equal: {path: spec.schedule, value: "0 3 * * *"}
      - equal: {path: spec.concurrencyPolicy, value: Forbid}
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].image", value: "docker.io/library/mariadb:11.8"}
  - it: labels backup pods with the backup component
    template: backup-cronjob.yaml
    asserts:
      - equal: {path: "spec.jobTemplate.spec.template.metadata.labels['app.kubernetes.io/component']", value: backup}
      - equal: {path: "spec.jobTemplate.spec.template.metadata.labels['app.kubernetes.io/instance']", value: RELEASE-NAME}
  - it: honours a custom schedule
    template: backup-cronjob.yaml
    set: {backup.schedule: "*/5 * * * *"}
    asserts:
      - equal: {path: spec.schedule, value: "*/5 * * * *"}
  - it: creates a 10Gi PVC by default
    template: backup-pvc.yaml
    asserts:
      - isKind: {of: PersistentVolumeClaim}
      - equal: {path: metadata.name, value: RELEASE-NAME-wavelog-backup}
      - equal: {path: spec.resources.requests.storage, value: 10Gi}
  - it: sets the storage class when given
    template: backup-pvc.yaml
    set: {backup.persistence.storageClass: fast}
    asserts:
      - equal: {path: spec.storageClassName, value: fast}
  - it: skips the PVC and mounts an existing claim
    set: {backup.persistence.existingClaim: my-backups}
    asserts:
      - hasDocuments: {count: 0}
        template: backup-pvc.yaml
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content: {name: backup, persistentVolumeClaim: {claimName: my-backups}}
        template: backup-cronjob.yaml
  - it: mounts the generated PVC by default
    template: backup-cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content: {name: backup, persistentVolumeClaim: {claimName: RELEASE-NAME-wavelog-backup}}
  - it: passes retention and the bundled database settings
    template: backup-cronjob.yaml
    asserts:
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content: {name: RETENTION, value: "7"}
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content: {name: DB_HOST, value: RELEASE-NAME-wavelog-mariadb}
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content: {name: DB_NAME, value: wavelog}
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content:
            name: MYSQL_PWD
            valueFrom: {secretKeyRef: {name: RELEASE-NAME-wavelog-mariadb, key: mariadb-password}}
  - it: never puts the password on the command line
    template: backup-cronjob.yaml
    asserts:
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].command", value: [bash, /scripts/backup.sh]}
      - notExists: {path: "spec.jobTemplate.spec.template.spec.containers[0].args"}
  - it: honours a custom retention
    template: backup-cronjob.yaml
    set: {backup.retention: 3}
    asserts:
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content: {name: RETENTION, value: "3"}
  - it: runs the dump as the non-root mysql user
    template: backup-cronjob.yaml
    asserts:
      - equal: {path: "spec.jobTemplate.spec.template.spec.securityContext.runAsUser", value: 999}
      - equal: {path: "spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot", value: true}
      - equal: {path: "spec.jobTemplate.spec.template.spec.initContainers[0].name", value: volume-permissions}
  - it: works against an external database
    template: backup-cronjob.yaml
    set:
      mariadb.enabled: false
      externalDatabase: {host: db.example.com, port: 3307, database: logs, username: logger, existingSecret: ext-db, passwordKey: pw}
    asserts:
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content: {name: DB_HOST, value: db.example.com}
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content: {name: DB_PORT, value: "3307"}
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content: {name: DB_USER, value: logger}
      - contains:
          path: "spec.jobTemplate.spec.template.spec.containers[0].env"
          content:
            name: MYSQL_PWD
            valueFrom: {secretKeyRef: {name: ext-db, key: pw}}
  - it: ships the backup script in a ConfigMap
    template: configmap-backup.yaml
    asserts:
      - isKind: {of: ConfigMap}
      - matchRegex: {path: "data['backup.sh']", pattern: "mariadb-dump"}
