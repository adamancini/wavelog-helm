      - equal: {path: "spec.ports[0].port", value: 3000}
        template: dxcache-service.yaml
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: WL_DXCACHE_URL, value: "http://logbook-dxcache.NAMESPACE.svc:3000"}
        template: deployment.yaml
---
suite: dxcache networkpolicy
templates:
  - networkpolicy.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
  networkPolicy: {enabled: true}
  dxcache:
    enabled: true
    callsign: N0CALL-7
    clusters: [{name: A, host: a.example, port: 7300}]
tests:
  - it: adds a DXCache NetworkPolicy
    asserts:
      - hasDocuments: {count: 3}
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: dxcache
        documentIndex: 2
      - equal: {path: "spec.ingress[0].ports[0].port", value: 3000}
        documentIndex: 2
---
suite: dxcache lookup gate script
templates:
  - configmap-dxcache.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
  dxcache:
    enabled: true
    callsign: N0CALL-7
    clusters: [{name: A, host: a.example, port: 7300}]
tests:
  - it: probes with the N0CALL placeholder, not a real callsign
    asserts:
      - matchRegex: {path: 'data["wait-lookup.js"]', pattern: 'callsign: "N0CALL"'}
      - notMatchRegex: {path: 'data["wait-lookup.js"]', pattern: 'DL1AA'}
  - it: logs the error message and the response status with a body excerpt
    asserts:
      - matchRegex: {path: 'data["wait-lookup.js"]', pattern: 'e\.message'}
      - matchRegex: {path: 'data["wait-lookup.js"]', pattern: 'status \$\{res\.status\}: \$\{excerpt\(text\)\}'}
