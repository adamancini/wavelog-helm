suite: dxcache
templates:
  - validate.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
tests:
  - it: rejects wizard mode
    set:
      install: {mode: wizard}
      dxcache:
        enabled: true
        clusters: [{name: A, host: a.example, port: 7300, call: N0CALL-7}]
    asserts:
      - failedTemplate:
          errorMessage: "dxcache.enabled requires install.mode=declarative"
  - it: requires a cluster
    set:
      dxcache: {enabled: true, clusters: []}
    asserts:
      - failedTemplate:
          errorMessage: "dxcache.clusters or dxcache.existingClustersSecret is required"
  - it: requires a callsign per cluster
    set:
      dxcache:
        enabled: true
        callsign: ""
        clusters: [{name: A, host: a.example, port: 7300}]
    asserts:
      - failedTemplate:
          errorPattern: "dxcache.clusters\\[0\\]: call or dxcache.callsign is required"
  - it: requires host and port
    set:
      dxcache:
        enabled: true
        clusters: [{name: A, call: N0CALL-7}]
    asserts:
      - failedTemplate:
          errorPattern: "dxcache.clusters\\[0\\]: host and port are required"
  - it: requires an RBN callsign
    set:
      dxcache:
        enabled: true
        callsign: ""
        existingClustersSecret: s
        rbn: {enabled: true, callsign: ""}
    asserts:
      - failedTemplate:
          errorMessage: "dxcache.rbn.enabled requires dxcache.rbn.callsign or dxcache.callsign"
  - it: accepts existingClustersSecret alone
    set:
      dxcache: {enabled: true, existingClustersSecret: s}
    asserts:
      - notFailedTemplate: {}
  - it: accepts a cluster with its own call and no default callsign
    set:
      dxcache:
        enabled: true
        callsign: ""
        clusters: [{name: A, host: a.example, port: 7300, call: N0CALL-8}]
    asserts:
      - notFailedTemplate: {}
---
suite: dxcache clusters secret
templates:
  - dxcache-secret.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
tests:
  - it: renders nothing when disabled
    asserts:
      - hasDocuments: {count: 0}
  - it: renders nothing with existingClustersSecret
    set:
      dxcache: {enabled: true, existingClustersSecret: s}
    asserts:
      - hasDocuments: {count: 0}
  - it: builds CLUSTERS with defaults
    set:
      dxcache:
        enabled: true
        callsign: N0CALL-7
        clusters:
          - {name: DM3KS, host: dm3ks.de, port: 7300}
          - {host: dxspots.com, port: 7300, call: N0CALL-8, customCommand: set/skimmer}
    asserts:
      - isKind: {of: Secret}
      - equal:
          path: data["clusters-json"]
          decodeBase64: true
          value: '[{"call":"N0CALL-7","cluster":"DM3KS","host":"dm3ks.de","loginPrompt":"login:","password":"","port":7300},{"call":"N0CALL-8","cluster":"dxspots.com","customCommand":"set/skimmer","host":"dxspots.com","loginPrompt":"login:","password":"","port":7300}]'
  - it: reads and trims a password from a Secret
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: pw, namespace: NAMESPACE}
          data: {password: "c2VjcmV0Cg=="}
    set:
      dxcache:
        enabled: true
        callsign: N0CALL-7
        clusters: [{name: A, host: a.example, port: 7300, existingSecret: pw}]
    asserts:
      - matchRegex:
          path: data["clusters-json"]
          decodeBase64: true
          pattern: '"password":"secret"'
  - it: fails when the password Secret is missing
    set:
      dxcache:
        enabled: true
        callsign: N0CALL-7
        clusters: [{name: A, host: a.example, port: 7300, existingSecret: nope}]
    asserts:
      - failedTemplate:
          errorPattern: "dxcache.clusters\\[0\\]: Secret nope key password not found"
---
suite: dxcache loopback key (secret)
templates:
  - secret-app.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
tests:
  - it: renders only the dxcache key when other secrets are existing
    set:
      config: {existingSecret: mine}
      install: {mode: declarative, admin: {existingSecret: mine}}
      dxcache:
        enabled: true
        clusters: [{name: A, host: a.example, port: 7300, call: N0CALL-7}]
    asserts:
      - hasDocuments: {count: 1}
      - exists: {path: 'data["dxcache-api-key"]'}
      - notExists: {path: 'data["encryption-key"]'}
  - it: omits the key when disabled
    asserts:
      - notExists: {path: 'data["dxcache-api-key"]'}
---
suite: dxcache bootstrap env
templates:
  - deployment.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
tests:
  - it: wires url and key when enabled
    set:
      config: {existingSecret: mine}
      dxcache:
        enabled: true
        clusters: [{name: A, host: a.example, port: 7300, call: N0CALL-7}]
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: WL_DXCACHE_API_KEY, valueFrom: {secretKeyRef: {name: RELEASE-NAME-wavelog-app, key: dxcache-api-key}}}
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: WL_DXCACHE_URL, value: "http://RELEASE-NAME-wavelog-dxcache.NAMESPACE.svc:3000"}
  - it: passes empty url and key when disabled
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: WL_DXCACHE_URL, value: ""}
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: WL_DXCACHE_API_KEY, value: ""}
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: WL_DXCACHE_URL_PREFIX, value: "http://RELEASE-NAME-wavelog-dxcache."}
