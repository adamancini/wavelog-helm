suite: dxcache deployment
templates:
  - dxcache-deployment.yaml
  - dxcache-secret.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
  dxcache:
    enabled: true
    callsign: N0CALL-7
    clusters: [{name: A, host: a.example, port: 7300}]
tests:
  - it: uses Recreate and one replica
    template: dxcache-deployment.yaml
    asserts:
      - equal: {path: spec.replicas, value: 1}
      - equal: {path: spec.strategy.type, value: Recreate}
  - it: pins the image
    template: dxcache-deployment.yaml
    asserts:
      - equal: {path: "spec.template.spec.containers[0].image", value: "ghcr.io/int2001/dxclusterapi:1.5.8"}
  - it: leaves SOTA polling off by default (retired upstream endpoint)
    template: dxcache-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SOTA_ENABLED, value: "false"}
  - it: lets SOTA polling be re-enabled
    template: dxcache-deployment.yaml
    set:
      dxcache.sota.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SOTA_ENABLED, value: "true"}
  - it: gates on the lookup
    template: dxcache-deployment.yaml
    asserts:
      - equal: {path: "spec.template.spec.initContainers[0].name", value: wait-lookup}
      - equal: {path: "spec.template.spec.initContainers[0].command", value: [bun, run, /wait/wait-lookup.js]}
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: WAVELOG_URL, value: "http://RELEASE-NAME-wavelog.NAMESPACE.svc:80/index.php/api/lookup"}
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: WAVELOG_KEY, valueFrom: {secretKeyRef: {name: RELEASE-NAME-wavelog-app, key: dxcache-api-key}}}
  - it: wires WAVELOG_URL through the Service port
    template: dxcache-deployment.yaml
    set:
      service: {port: 8080}
      auth:
        mode: header
        header:
          jwksUri: https://idp.example.com/realms/example/protocol/openid-connect/certs
      oauth2Proxy:
        enabled: true
        issuerUrl: https://idp.example.com/realms/example
        existingSecret: wavelog-oauth2-proxy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: WAVELOG_URL, value: "http://RELEASE-NAME-wavelog.NAMESPACE.svc:8080/index.php/api/lookup"}
  - it: reads CLUSTERS from existingClustersSecret
    template: dxcache-deployment.yaml
    set:
      dxcache: {existingClustersSecret: s}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLUSTERS, valueFrom: {secretKeyRef: {name: s, key: clusters-json}}}
  - it: lets extraEnv override
    template: dxcache-deployment.yaml
    set:
      dxcache:
        extraEnv: [{name: LIVE_PAGE_ENABLED, value: "true"}]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LIVE_PAGE_ENABLED, value: "true"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: LIVE_PAGE_ENABLED, value: "false"}
      - lengthEqual: {path: "spec.template.spec.containers[0].env", count: 33}
  - it: does not mount the service account token
    template: dxcache-deployment.yaml
    asserts:
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: false}
      - exists: {path: 'spec.template.metadata.annotations["checksum/wait"]'}
  # sha256 of [{"call":"N0CALL-7","cluster":"A","host":"a.example","loginPrompt":"login:","password":"","port":7300}]
  - it: hashes only the cluster list into checksum/clusters
    template: dxcache-deployment.yaml
    asserts:
      - equal:
          path: 'spec.template.metadata.annotations["checksum/clusters"]'
          value: 84fdb6a07252158103be999bf5cf6548ef04f27f4c9ebf2905591ea860739ec2
  - it: keeps checksum/clusters across chart version bumps
    template: dxcache-deployment.yaml
    chart:
      version: 9.9.9
    asserts:
      - equal:
          path: 'spec.template.metadata.annotations["checksum/clusters"]'
          value: 84fdb6a07252158103be999bf5cf6548ef04f27f4c9ebf2905591ea860739ec2
  - it: changes checksum/clusters when the cluster list changes
    template: dxcache-deployment.yaml
    set:
      dxcache.clusters: [{name: A, host: a.example, port: 7301}]
    asserts:
      - notEqual:
          path: 'spec.template.metadata.annotations["checksum/clusters"]'
          value: 84fdb6a07252158103be999bf5cf6548ef04f27f4c9ebf2905591ea860739ec2
  - it: keeps false and zero overrides in security contexts
    template: dxcache-deployment.yaml
    set:
      dxcache:
        securityContext: {readOnlyRootFilesystem: false}
        podSecurityContext: {runAsNonRoot: false, runAsUser: 0}
    asserts:
      - equal: {path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: false}
      - equal: {path: "spec.template.spec.securityContext.runAsUser", value: 0}
      - equal: {path: "spec.template.spec.securityContext.runAsNonRoot", value: false}
      - equal: {path: "spec.template.spec.containers[0].securityContext.capabilities.drop", value: [ALL]}
      - equal: {path: "spec.template.spec.securityContext.fsGroup", value: 1000}
  - it: mounts the existing claim
    template: dxcache-deployment.yaml
    set:
      dxcache: {persistence: {existingClaim: c}}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: {name: data, persistentVolumeClaim: {claimName: c}}
---
suite: dxcache pvc
templates:
  - dxcache-pvc.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
  dxcache:
    enabled: true
    callsign: N0CALL-7
