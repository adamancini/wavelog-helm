suite: dxcache names
templates:
  - dxcache-service.yaml
  - deployment.yaml
set:
  baseUrl: https://w.example.com
  install:
    mode: declarative
  fullnameOverride: logbook
  dxcache:
    enabled: true
    callsign: N0CALL-7
    clusters: [{name: A, host: a.example, port: 7300}]
tests:
  - it: follows fullnameOverride
    asserts:
      - equal: {path: metadata.name, value: logbook-dxcache}
