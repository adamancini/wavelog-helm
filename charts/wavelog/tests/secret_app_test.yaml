suite: app secret
templates:
  - secret-app.yaml
set:
  baseUrl: https://w.example.com
tests:
  - it: generates the encryption key and admin password
    asserts:
      - isKind: {of: Secret}
      - equal: {path: metadata.name, value: RELEASE-NAME-wavelog-app}
      - exists: {path: 'data["encryption-key"]'}
      - exists: {path: 'data["admin-password"]'}
  - it: renders nothing when both existing secrets are set
    set: {config.existingSecret: s, install.admin.existingSecret: s}
    asserts:
      - hasDocuments: {count: 0}
  - it: only generates the admin password when the key comes from an existing secret
    set: {config.existingSecret: s}
    asserts:
      - exists: {path: 'data["admin-password"]'}
      - notExists: {path: 'data["encryption-key"]'}
  - it: only generates the encryption key when the admin password comes from an existing secret
    set: {install.admin.existingSecret: s}
    asserts:
      - exists: {path: 'data["encryption-key"]'}
      - notExists: {path: 'data["admin-password"]'}
  - it: renders nothing in wizard mode
    set: {install.mode: wizard}
    asserts:
      - hasDocuments: {count: 0}
  - it: keeps the generated Secret on uninstall
    asserts:
      - equal: {path: 'metadata.annotations["helm.sh/resource-policy"]', value: keep}
  - it: keeps the DXCache key when disabled and the Secret already holds it
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: RELEASE-NAME-wavelog-app, namespace: NAMESPACE}
          data: {dxcache-api-key: "a2VwdGtleQ==", encryption-key: "ZW5j", admin-password: "cHc="}
    set:
      dxcache: {enabled: false}
      install: {mode: declarative}
    asserts:
      - equal: {path: 'data["dxcache-api-key"]', value: "a2VwdGtleQ=="}
