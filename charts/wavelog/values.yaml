image:
  repository: ghcr.io/wavelog/wavelog
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Public URL of the site, e.g. https://wavelog.example.com/
baseUrl: ""

php:
  memoryLimit: 256M
  uploadMaxFilesize: 64M
  postMaxSize: 64M
  maxExecutionTime: 600

cron:
  # false sets DISABLE_CRON=true
  enabled: true

install:
  # declarative: the bootstrap init container renders config and installs the
  # schema. wizard: use Wavelog's web installer.
  mode: declarative
  # How long the bootstrap init container waits for the database.
  dbWaitSeconds: 300
  admin:
    username: admin
    email: admin@example.com
    callsign: N0CALL
    locator: AA00aa
    firstName: ""
    lastName: ""
    timezone: 0
    dxcc: 0
    city: ""
    language: english
    # Existing Secret holding the admin password under passwordKey. When unset
    # a password is generated into the <fullname>-app Secret.
    existingSecret: ""
    passwordKey: admin-password

config:
  locator: AA00aa
  # hamqth | qrz | qrzcq | qrzru | qrzcall
  callbook: hamqth
  logThreshold: 0
  # Existing Secret with keys: encryption-key and, optionally,
  # callbook-username, callbook-password, qrzcall-token.
  existingSecret: ""
  # Extra $config[key] = value entries; any scalar, list or map.
  extra: {}

# Declarative API keys (install.mode=declarative). Upserted by key value on
# every start; keys not listed here are never deleted. Each entry:
#   description: free text
#   rights: r | rw
#   user: Wavelog user name (default: the install admin)
#   existingSecret / secretKey: Secret holding the key (secretKey defaults to api-key)
apiKeys: []

auth:
  # local | header
  mode: local

mariadb:
  # false uses externalDatabase instead of the bundled MariaDB.
  enabled: true
  image:
    repository: docker.io/library/mariadb
    tag: "11.8"
    pullPolicy: IfNotPresent
  auth:
    database: wavelog
    username: wavelog
    # Existing Secret holding passwordKey and rootPasswordKey; skips generation.
    existingSecret: ""
    passwordKey: mariadb-password
    rootPasswordKey: mariadb-root-password
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
    existingClaim: ""
  resources: {}

externalDatabase:
  host: ""
  port: 3306
  database: wavelog
  username: wavelog
  existingSecret: ""
  passwordKey: mariadb-password

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
