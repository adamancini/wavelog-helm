image:
  repository: ghcr.io/wavelog/wavelog
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Public URL of the site, e.g. https://wavelog.example.com/
baseUrl: ""

php:
  memoryLimit: 256M
  uploadMaxFilesize: 64M
  postMaxSize: 64M
  maxExecutionTime: 600

cron:
  # false sets DISABLE_CRON=true
  enabled: true

install:
  # declarative: the bootstrap init container renders config and installs the
  # schema. wizard: use Wavelog's web installer.
  mode: declarative
  # How long the bootstrap init container waits for the database.
  dbWaitSeconds: 300
  admin:
    username: admin
    email: admin@example.com
    callsign: N0CALL
    locator: AA00aa
    firstName: ""
    lastName: ""
    timezone: 0
    dxcc: 0
    city: ""
    language: english
    # Existing Secret holding the admin password under passwordKey. When unset
    # a password is generated into the <fullname>-app Secret.
    existingSecret: ""
    passwordKey: admin-password

config:
  locator: AA00aa
  # hamqth | qrz | qrzcq | qrzru | qrzcall
  callbook: hamqth
  # 0 = off, 1 = errors (incl. PHP), 2 = debug, 3 = info, 4 = all
  logThreshold: 1
  # Existing Secret with keys: encryption-key and, optionally,
  # callbook-username, callbook-password, qrzcall-token.
  existingSecret: ""
  # Extra $config[key] = value entries; any scalar, list or map.
  extra: {}

# Declarative API keys (install.mode=declarative). Upserted by key value on
# every start; keys not listed here are never deleted. Each entry:
#   description: free text
#   rights: r | rw
#   user: Wavelog user name (default: the install admin)
#   existingSecret / secretKey: Secret holding the key (secretKey defaults to api-key)
apiKeys: []

auth:
  # local: Wavelog's own login form. header: also accept a signed JWT access
  # token forwarded in a request header by a trusted reverse proxy (requires
  # install.mode=declarative, which renders sso.php).
  mode: local
  header:
    # JWKS endpoint used to verify token signatures. Required in header mode.
    jwksUri: ""
    # PHP $_SERVER name of the token header (X-Forwarded-Access-Token).
    headerName: HTTP_X_FORWARDED_ACCESS_TOKEN
    # Create a Wavelog user on first login of an unknown identity.
    createUsers: false
    # Keep the username/password form next to the SSO button.
    allowDirectLogin: true
    hidePasswordField: false
    buttonText: Login with SSO
    # Redirect after logout; empty returns to the Wavelog login page.
    logoutUrl: ""
    # Link the install admin to this IdP identity (token iss and sub claims)
    # on every start. Set both or neither.
    adminIdentity:
      issuer: ""
      subject: ""
    # Extra sso.php $config[key] = value entries, written verbatim by key,
    # e.g. auth_headers_claim_config.
    extra: {}

oauth2Proxy:
  # Sidecar that performs the OIDC login and forwards the access token to
  # Wavelog as X-Forwarded-Access-Token. Requires auth.mode=header. When on, the
  # Service exposes only the proxy (4180); Apache's port 80 is not a Service port.
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.12.0
    pullPolicy: IfNotPresent
  # OIDC issuer URL. Required when enabled.
  issuerUrl: ""
  # Existing Secret with keys client-id, client-secret and cookie-secret
  # (16, 24 or 32 bytes). Required when enabled.
  existingSecret: ""
  # Regexes that bypass login so API clients can use their API key.
  skipAuthRoutes:
    - "^/index.php/api/"
  # Extra command-line arguments, appended verbatim.
  extraArgs: []
  resources: {}

mariadb:
  # false uses externalDatabase instead of the bundled MariaDB.
  enabled: true
  image:
    repository: docker.io/library/mariadb
    tag: "11.8"
    pullPolicy: IfNotPresent
  auth:
    database: wavelog
    username: wavelog
    # Existing Secret holding passwordKey and rootPasswordKey; skips generation.
    existingSecret: ""
    passwordKey: mariadb-password
    rootPasswordKey: mariadb-root-password
  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi
    existingClaim: ""
  resources: {}

externalDatabase:
  host: ""
  port: 3306
  database: wavelog
  username: wavelog
  existingSecret: ""
  passwordKey: mariadb-password

# Stream Wavelog's application log (application/logs, one file per UTC day)
# to the stdout of a `logs` container, so it shows in `kubectl logs -c logs`
# and log collectors. Without it the log only exists inside the pod.
logSidecar:
  enabled: true
  resources: {}

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  existingClaim: ""
  # Annotate the data PVC with helm.sh/resource-policy: keep so `helm uninstall`
  # leaves the data in place. Delete the claim by hand to remove it.
  keep: true

backup:
  enabled: false
  schedule: "0 3 * * *"
  retention: 7
  persistence:
    storageClass: ""
    size: 10Gi
    existingClaim: ""
    # Keep the backup PVC on `helm uninstall` (helm.sh/resource-policy: keep).
    keep: true
  resources: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Required when enabled. Add a tls entry for HTTPS, e.g.
  #   - secretName: wavelog-tls
  #     hosts: [wavelog.example.com]
  host: ""
  tls: []

# Gateway API HTTPRoute. parentRefs is required when enabled.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  hostnames: []

# Ingress to the app pod is limited to the Service target port and ingress to
# the bundled MariaDB to the Wavelog and backup pods. Egress is not restricted
# (Wavelog calls LoTW, Club Log, eQSL, QRZ and the JWKS URI).
networkPolicy:
  enabled: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Extra /etc/hosts entries for the Wavelog pod ({ip, hostnames} list).
hostAliases: []
