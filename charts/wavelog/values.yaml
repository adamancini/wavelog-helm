image:
  repository: ghcr.io/wavelog/wavelog
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Public URL of the site, e.g. https://wavelog.example.com/
baseUrl: ""

php:
  memoryLimit: 256M
  uploadMaxFilesize: 64M
  postMaxSize: 64M
  maxExecutionTime: 600

cron:
  # false sets DISABLE_CRON=true
  enabled: true

install:
  # declarative | wizard
  mode: declarative

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi
  accessModes:
    - ReadWriteOnce
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
