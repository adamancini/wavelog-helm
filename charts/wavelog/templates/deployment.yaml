{{- include "wavelog.auth.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wavelog.fullname" . }}
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wavelog.appSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wavelog.appSelectorLabels" . | nindent 8 }}
      {{- /*
      A changed bootstrap script rolls the pod. The app Secret is not hashed: its
      values are pinned by lookup, any change to which keys it holds also changes
      this pod's secretKeyRefs, and hashing a re-render would see a fresh random
      value on first install and roll the pod on the first upgrade.
      */}}
      {{- $annotations := dict }}
      {{- if eq .Values.install.mode "declarative" }}
      {{- $_ := set $annotations "checksum/bootstrap" (.Files.Get "files/bootstrap.php" | sha256sum) }}
      {{- end }}
      {{- $annotations = merge $annotations (.Values.podAnnotations | default dict) }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wavelog.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: volume-permissions
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for d in {{ include "wavelog.writablePaths" . }}; do
                find "$d" \( ! -user 999 -o ! -group 33 \) -exec chown 999:33 {} +
                find "$d" ! -perm -g+rw -exec chmod g+rwX {} +
              done
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            {{- include "wavelog.volumeMounts" . | nindent 12 }}
            {{- include "wavelog.configMount" . | nindent 12 }}
        {{- if eq .Values.install.mode "declarative" }}
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - php
            - -d
            - memory_limit={{ .Values.php.memoryLimit }}
            - -d
            - max_execution_time={{ .Values.php.maxExecutionTime }}
            - /bootstrap/bootstrap.php
          securityContext:
            runAsUser: 999
            runAsGroup: 33
            allowPrivilegeEscalation: false
          env:
            - {name: WL_CONFIG_DIR, value: /var/www/html/application/config/docker}
            - {name: WL_BASE_URL, value: {{ include "wavelog.baseUrl" . | toJson }}}
            - {name: WL_LOCATOR, value: {{ .Values.config.locator | toString | toJson }}}
            - {name: WL_CALLBOOK, value: {{ .Values.config.callbook | toString | toJson }}}
            - {name: WL_LOG_THRESHOLD, value: {{ .Values.config.logThreshold | toString | toJson }}}
            - name: WL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "wavelog.app.secretName" . }}, key: encryption-key}
            {{- range $env, $key := dict "WL_CALLBOOK_USERNAME" "callbook-username" "WL_CALLBOOK_PASSWORD" "callbook-password" "WL_QRZCALL_TOKEN" "qrzcall-token" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef: {name: {{ include "wavelog.app.secretName" $ }}, key: {{ $key }}, optional: true}
            {{- end }}
            - {name: WL_DB_HOST, value: {{ include "wavelog.db.host" . | toJson }}}
            - {name: WL_DB_PORT, value: {{ include "wavelog.db.port" . | toString | toJson }}}
            - {name: WL_DB_NAME, value: {{ include "wavelog.db.name" . | toJson }}}
            - {name: WL_DB_USER, value: {{ include "wavelog.db.user" . | toJson }}}
            - name: WL_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "wavelog.db.secretName" . }}, key: {{ include "wavelog.db.passwordKey" . }}}
            - {name: WL_DB_WAIT_SECONDS, value: {{ .Values.install.dbWaitSeconds | toString | toJson }}}
            - {name: WL_ADMIN_USERNAME, value: {{ .Values.install.admin.username | toString | toJson }}}
            - {name: WL_ADMIN_EMAIL, value: {{ .Values.install.admin.email | toString | toJson }}}
            - {name: WL_ADMIN_CALLSIGN, value: {{ .Values.install.admin.callsign | toString | toJson }}}
            - {name: WL_ADMIN_LOCATOR, value: {{ .Values.install.admin.locator | toString | toJson }}}
            - {name: WL_ADMIN_FIRSTNAME, value: {{ .Values.install.admin.firstName | toString | toJson }}}
            - {name: WL_ADMIN_LASTNAME, value: {{ .Values.install.admin.lastName | toString | toJson }}}
            - {name: WL_ADMIN_TIMEZONE, value: {{ .Values.install.admin.timezone | toString | toJson }}}
            - {name: WL_ADMIN_DXCC, value: {{ .Values.install.admin.dxcc | toString | toJson }}}
            - {name: WL_ADMIN_CITY, value: {{ .Values.install.admin.city | toString | toJson }}}
            - {name: WL_ADMIN_LANGUAGE, value: {{ .Values.install.admin.language | toString | toJson }}}
            - name: WL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "wavelog.admin.secretName" . }}, key: {{ .Values.install.admin.passwordKey }}}
            - {name: WL_EXTRA_CONFIG_JSON, value: {{ toJson .Values.config.extra | toJson }}}
            - {name: WL_AUTH_MODE, value: {{ default "local" .Values.auth.mode | toJson }}}
            {{- if eq (default "local" .Values.auth.mode) "header" }}
            - {name: WL_SSO_JSON, value: {{ omit .Values.auth.header "adminIdentity" | toJson | toJson }}}
            {{- with .Values.auth.header.adminIdentity }}
            {{- if and .issuer .subject }}
            - {name: WL_ADMIN_ISS, value: {{ .issuer | toString | toJson }}}
            - {name: WL_ADMIN_SUB, value: {{ .subject | toString | toJson }}}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $keys := list }}
            {{- range $i, $k := .Values.apiKeys }}
            {{- if not (has ($k.rights | default "") (list "r" "rw")) }}
            {{- fail "apiKeys[].rights must be r or rw" }}
            {{- end }}
            {{- $_ := required (printf "apiKeys[%d].existingSecret is required" $i) $k.existingSecret }}
            {{- $keys = append $keys (dict "description" ($k.description | default "") "rights" $k.rights "user" ($k.user | default "")) }}
            - name: {{ printf "WL_API_KEY_%d" $i }}
              valueFrom:
                secretKeyRef: {name: {{ $k.existingSecret | toJson }}, key: {{ $k.secretKey | default "api-key" | toJson }}}
            {{- end }}
            - {name: WL_API_KEYS_JSON, value: {{ toJson $keys | toJson }}}
          volumeMounts:
            {{- include "wavelog.configMount" . | nindent 12 }}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
        {{- end }}
      containers:
        - name: wavelog
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PHP_MEMORY_LIMIT
              value: {{ .Values.php.memoryLimit | quote }}
            - name: PHP_UPLOAD_MAX_FILESIZE
              value: {{ .Values.php.uploadMaxFilesize | quote }}
            - name: PHP_POST_MAX_SIZE
              value: {{ .Values.php.postMaxSize | quote }}
            - name: PHP_MAX_EXECUTION_TIME
              value: {{ .Values.php.maxExecutionTime | quote }}
            {{- if not .Values.cron.enabled }}
            - name: DISABLE_CRON
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: {{ include "wavelog.readinessPath" . }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "wavelog.volumeMounts" . | nindent 12 }}
            {{- if eq .Values.install.mode "declarative" }}
            - name: config
              mountPath: /var/www/html/application/config/docker
              readOnly: true
            {{- else }}
            {{- include "wavelog.configMount" . | nindent 12 }}
            {{- end }}
        {{- if .Values.oauth2Proxy.enabled }}
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}"
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:80/
            - --provider=oidc
            - {{ printf "--oidc-issuer-url=%s" .Values.oauth2Proxy.issuerUrl | toJson }}
            - --pass-access-token=true
            - --set-xauthrequest=true
            - --reverse-proxy=true
            - --email-domain=*
            - --skip-provider-button=true
            {{- range .Values.oauth2Proxy.skipAuthRoutes }}
            - {{ printf "--skip-auth-route=%s" . | toJson }}
            {{- end }}
            {{- range .Values.oauth2Proxy.extraArgs }}
            - {{ . | toJson }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: {{ .Values.oauth2Proxy.existingSecret | toJson }}, key: client-id}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.oauth2Proxy.existingSecret | toJson }}, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.oauth2Proxy.existingSecret | toJson }}, key: cookie-secret}
          ports:
            - name: proxy
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet: {path: /ping, port: proxy}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ping, port: proxy}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with .Values.oauth2Proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.logSidecar.enabled }}
        - name: logs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [bash, -c]
          args:
            - {{ .Files.Get "files/log-tail.sh" | toJson }}
          securityContext:
            runAsUser: 999
            runAsGroup: 33
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- with .Values.logSidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cache
              mountPath: /var/www/html/application/logs
              subPath: logs
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "wavelog.dataClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cache
          emptyDir: {}
        {{- if eq .Values.install.mode "declarative" }}
        - name: config
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: {{ include "wavelog.fullname" . }}-bootstrap
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
