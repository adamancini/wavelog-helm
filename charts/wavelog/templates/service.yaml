{{- include "wavelog.auth.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wavelog.fullname" . }}
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ ternary "proxy" "http" .Values.oauth2Proxy.enabled }}
      protocol: TCP
  selector:
    {{- include "wavelog.appSelectorLabels" . | nindent 4 }}
