{{- /* Generated secrets persist across upgrades via lookup; an existingSecret always wins. */ -}}
{{- $needKey := not .Values.config.existingSecret }}
{{- $needAdmin := not .Values.install.admin.existingSecret }}
{{- $name := printf "%s-app" (include "wavelog.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if and $existing $existing.data }}{{- $data = $existing.data }}{{- end }}
{{- /* The DXCache key is kept once it exists, even when dxcache is disabled, so a re-enable reuses it and never orphans an API key row. */ -}}
{{- $needDx := or .Values.dxcache.enabled (hasKey $data "dxcache-api-key") }}
{{- if and (eq .Values.install.mode "declarative") (or $needKey $needAdmin $needDx) }}
{{- $adminKey := .Values.install.admin.passwordKey }}
{{- $encKey := randAlphaNum 32 }}
{{- if hasKey $data "encryption-key" }}{{- $encKey = index $data "encryption-key" | b64dec }}{{- end }}
{{- $adminPw := randAlphaNum 32 }}
{{- if hasKey $data $adminKey }}{{- $adminPw = index $data $adminKey | b64dec }}{{- end }}
{{- $dxKey := randAlphaNum 40 }}
{{- if hasKey $data "dxcache-api-key" }}{{- $dxKey = index $data "dxcache-api-key" | b64dec }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needKey }}
  encryption-key: {{ $encKey | b64enc | quote }}
  {{- end }}
  {{- if $needAdmin }}
  {{ $adminKey }}: {{ $adminPw | b64enc | quote }}
  {{- end }}
  {{- if $needDx }}
  dxcache-api-key: {{ $dxKey | b64enc | quote }}
  {{- end }}
{{- end }}
