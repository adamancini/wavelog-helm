{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) }}
{{- $name := include "wavelog.mariadb.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 32 }}
{{- $rootPassword := randAlphaNum 32 }}
{{- if and $existing $existing.data }}
{{- $password = (index $existing.data "mariadb-password") | b64dec }}
{{- $rootPassword = (index $existing.data "mariadb-root-password") | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
type: Opaque
data:
  mariadb-password: {{ $password | b64enc | quote }}
  mariadb-root-password: {{ $rootPassword | b64enc | quote }}
{{- end }}
