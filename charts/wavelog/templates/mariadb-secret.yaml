{{- if and .Values.mariadb.enabled (not .Values.mariadb.auth.existingSecret) }}
{{- $name := include "wavelog.mariadb.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pk := .Values.mariadb.auth.passwordKey }}
{{- $rk := .Values.mariadb.auth.rootPasswordKey }}
{{- $password := randAlphaNum 32 }}
{{- $rootPassword := randAlphaNum 32 }}
{{- if and $existing $existing.data }}
{{- $password = (index $existing.data $pk) | b64dec }}
{{- $rootPassword = (index $existing.data $rk) | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  {{- if .Values.mariadb.persistence.enabled }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
type: Opaque
data:
  {{ $pk }}: {{ $password | b64enc | quote }}
  {{ $rk }}: {{ $rootPassword | b64enc | quote }}
{{- end }}
