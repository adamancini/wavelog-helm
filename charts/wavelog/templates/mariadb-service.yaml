{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wavelog.mariadb.fullname" . }}
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "wavelog.mariadb.selectorLabels" . | nindent 4 }}
{{- end }}
