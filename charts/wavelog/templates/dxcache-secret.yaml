{{- if and .Values.dxcache.enabled (not .Values.dxcache.existingClustersSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wavelog.dxcache.fullname" . }}
  labels:
    {{- include "wavelog.labels" . | nindent 4 }}
    app.kubernetes.io/component: dxcache
type: Opaque
data:
  clusters-json: {{ include "wavelog.dxcache.clustersJson" . | b64enc | quote }}
{{- end }}
